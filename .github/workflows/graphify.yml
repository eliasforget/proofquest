name: Graphify code map

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "app/src/**"
      - "app/supabase/functions/**"
      - "architecture/**"
      - "scripts/GRAPHIFY_CODE.ps1"
      - ".github/workflows/graphify.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graphify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Graphify
        run: python -m pip install --upgrade graphifyy

      - name: Build ProofQuest code graph
        run: |
          graphify app/src --no-viz
          graphify cluster-only app/src

      - name: Upload graph artifact
        uses: actions/upload-artifact@v4
        with:
          name: proofquest-graphify
          path: app/src/graphify-out/
          if-no-files-found: error
          retention-days: 14
